<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 310 156" width="310" height="156" fill="none" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Shared car</title>
  <desc id="dsc">Compact rounded car with the three students seated inside, visible through its windows, resting on a soft ground shadow.</desc>
  <!--
    Coordinates are the car's own local units, shared by both scene compositions.
    Anchor (axle point) = (153, 134): midway between the two wheel centres.
    Scenes place it with: translate(axleX, axleY) rotate(tilt) scale(s * flip, s) translate(-153, -134)
    Desktop s = 1.15, mobile s = 1.2. The shadow lives inside the group so it travels with the car.
  -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g id="vehicle">
      <ellipse id="vehicle-shadow" cx="153" cy="159" rx="146" ry="6" fill="#05070F"/>

      <g id="vehicle-wheels">
        <circle cx="62" cy="134" r="22" fill="#18203A" stroke="#E4DCFA" stroke-width="4"/>
        <circle cx="244" cy="134" r="22" fill="#18203A" stroke="#E4DCFA" stroke-width="4"/>
        <circle cx="62" cy="134" r="8" fill="#3B4670" stroke="#E4DCFA" stroke-width="3.2"/>
        <circle cx="244" cy="134" r="8" fill="#3B4670" stroke="#E4DCFA" stroke-width="3.2"/>
      </g>

      <path id="vehicle-body"
        d="M 20 104 L 66 46 Q 74 40 88 40 L 186 40 Q 200 40 208 48 L 232 84
           Q 238 90 248 92 L 276 96 Q 292 100 296 110 C 302 120 300 129 294 132 Q 290 134 282 134
           H 266 A 22 22 0 0 0 222 134 H 84 A 22 22 0 0 0 40 134 H 24
           Q 14 134 14 124 V 114 Q 14 104 20 104 Z"
        fill="#1F2944" stroke="#E4DCFA" stroke-width="4"/>

      <g id="vehicle-windows">
        <path d="M 176 46 L 200 46 L 224 86 L 176 86 Z" fill="#2B3557"/>
        <path d="M 112 48 L 168 48 L 168 86 L 112 86 Z" fill="#2B3557"/>
        <path d="M 73 48 L 106 48 L 106 86 L 43 86 Z" fill="#2B3557"/>
      </g>

      <clipPath id="vehicle-window-clip"><path d="M 176 46 L 200 46 L 224 86 L 176 86 Z M 112 48 L 168 48 L 168 86 L 112 86 Z M 73 48 L 106 48 L 106 86 L 43 86 Z"/></clipPath>
      <g id="passengers" clip-path="url(#vehicle-window-clip)">
        <!-- passenger-n matches stand-n: 1 backpack, 2 suitcase (bun), 3 tote (cap) -->
        <g id="passenger-1">
          <path d="M 52 86 Q 76 74 100 86 Z" fill="#7A63B5" stroke="#E4DCFA" stroke-width="3"/>
          <g transform="translate(84,67) scale(0.9) translate(0,56)"><g class="head"><circle cx="0" cy="-56" r="13" fill="#B3A1E0" stroke="#E4DCFA" stroke-width="3.4"/>
      <g class="face"><circle cx="-4.6" cy="-56.2" r="2.1" fill="#1E1A4D"/><circle cx="4.6" cy="-56.2" r="2.1" fill="#1E1A4D"/>
      <path d="M -7.2 -61.6 Q -4.8 -63.4 -2.4 -62.2 M 2.4 -62.2 Q 4.8 -63.4 7.2 -61.6" stroke="#1E1A4D" stroke-width="1.9"/>
      <path d="M -4.6 -50.6 Q 0 -46.2 4.6 -50.6" stroke="#1E1A4D" stroke-width="2.2"/></g><g class="hair"><path d="M -13.4 -57 C -14.6 -70 -4.5 -74.5 2.5 -71.8 C 9.5 -73.6 15.2 -67 13.4 -58.5 C 11 -63.6 6.4 -66.6 1.2 -65.8 C -2.8 -65.2 -6.2 -67 -8.6 -64.6 C -10.8 -63.4 -12.6 -61 -13.4 -57 Z" fill="#7058B4"/></g></g></g>
        </g>
        <g id="passenger-2">
          <path d="M 118 86 Q 140 72 162 86 Z" fill="#A98ADF" stroke="#E4DCFA" stroke-width="3"/>
          <g transform="translate(140,66) scale(0.9) translate(0,56)"><g class="head"><circle cx="0" cy="-56" r="13" fill="#B3A1E0" stroke="#E4DCFA" stroke-width="3.4"/>
      <g class="face"><circle cx="-4.6" cy="-56.2" r="2.1" fill="#1E1A4D"/><circle cx="4.6" cy="-56.2" r="2.1" fill="#1E1A4D"/>
      <path d="M -7.2 -61.6 Q -4.8 -63.4 -2.4 -62.2 M 2.4 -62.2 Q 4.8 -63.4 7.2 -61.6" stroke="#1E1A4D" stroke-width="1.9"/>
      <path d="M -5 -51.2 Q 0 -44.2 5 -51.2 Z" fill="#15122E" stroke="#1E1A4D" stroke-width="2"/></g><g class="hair"><circle cx="0" cy="-73" r="5.6" fill="#7058B4"/><path d="M -13.6 -54 C -14.2 -68.8 -6.2 -71.6 0 -71.6 C 6.2 -71.6 14.2 -68.8 13.6 -54 C 11.2 -60.8 6.2 -64.6 0 -64.6 C -6.2 -64.6 -11.2 -60.8 -13.6 -54 Z" fill="#7058B4"/><path d="M -13.2 -54 C -14.8 -49.5 -14.2 -46 -11.8 -43.6" stroke="#7058B4" stroke-width="3.4"/></g></g></g>
        </g>
        <g id="passenger-3">
          <path d="M 182 86 Q 196 73 210 86 Z" fill="#232D4C" stroke="#E4DCFA" stroke-width="3"/>
          <g transform="translate(196,66) scale(0.9) translate(0,56)"><g class="head"><circle cx="0" cy="-56" r="13" fill="#B3A1E0" stroke="#E4DCFA" stroke-width="3.4"/>
      <g class="face"><circle cx="-4.6" cy="-56.2" r="2.1" fill="#1E1A4D"/><circle cx="4.6" cy="-56.2" r="2.1" fill="#1E1A4D"/>
      <path d="M -7.2 -61.6 Q -4.8 -63.4 -2.4 -62.2 M 2.4 -62.2 Q 4.8 -63.4 7.2 -61.6" stroke="#1E1A4D" stroke-width="1.9"/>
      <path d="M -3.4 -50.2 Q 1.2 -46.6 5.4 -51.4" stroke="#1E1A4D" stroke-width="2.2"/></g><g class="hair"><path d="M -13.2 -62 C -13.2 -71.4 -6.4 -74.4 0 -74.4 C 6.4 -74.4 13.2 -71.4 13.2 -62 Z" fill="#15122E" stroke="#7058B4" stroke-width="3"/><path d="M 7 -62 L 21.5 -62 Q 23 -59.6 19.6 -59.4 L 8.4 -59.8" fill="#15122E" stroke="#7058B4" stroke-width="3"/><circle cx="0" cy="-74.4" r="1.8" fill="#7058B4"/></g></g></g>
        </g>
      </g>

      <g id="vehicle-window-frames" fill="none" stroke="#E4DCFA" stroke-width="3.4">
        <path d="M 176 46 L 200 46 L 224 86 L 176 86 Z"/>
        <path d="M 112 48 L 168 48 L 168 86 L 112 86 Z"/>
        <path d="M 73 48 L 106 48 L 106 86 L 43 86 Z"/>
      </g>

      <g id="vehicle-details">
        <path d="M 176 92 L 176 124" stroke="#4E5880" stroke-width="2.6"/>
        <rect x="268" y="100" width="18" height="12" rx="5" fill="#F0913F" stroke="#E4DCFA" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
