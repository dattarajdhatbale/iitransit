<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 48 680 456" width="680" height="456" fill="none" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">IIT Bhubaneswar main building</title>
  <desc id="dsc">Simplified hand-drawn front elevation of the IIT Bhubaneswar main building: a broad symmetrical four-storey block with a stepped central pavilion, a ribbed dome on a louvred drum, ribbon windows across the wings and a columned entrance porch, resting on a soft ground shadow.</desc>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ GROUND SHADOW ============ -->
    <ellipse id="building-shadow" cx="400" cy="490" rx="330" ry="10" fill="#C7BBD9"/>

    <!-- ============ MAIN MASS ============ -->
    <g id="building-main">
      <!-- broad symmetrical wings -->
      <path id="building-wing-left" d="M 86 240 L 296 240 L 296 470 L 86 470 Z" fill="#F1EDFA" stroke="#1E1A4D" stroke-width="12"/>
      <path id="building-wing-right" d="M 504 240 L 714 240 L 714 470 L 504 470 Z" fill="#F1EDFA" stroke="#1E1A4D" stroke-width="12"/>
      <!-- stepped central pavilion -->
      <path id="building-central-lower" d="M 268 377 L 532 377 L 532 470 L 268 470 Z" fill="#F5F2F9" stroke="#1E1A4D" stroke-width="12"/>
      <path id="building-central-middle" d="M 296 295 L 504 295 L 504 377 L 296 377 Z" fill="#F5F2F9" stroke="#1E1A4D" stroke-width="12"/>
      <path id="building-central-upper" d="M 318 222 L 482 222 L 482 295 L 318 295 Z" fill="#F5F2F9" stroke="#1E1A4D" stroke-width="12"/>
      <!-- cornice ledges -->
      <path id="building-cornice-tower" d="M 306 206 L 494 206 L 494 224 L 306 224 Z" fill="#E7DFF5" stroke="#1E1A4D" stroke-width="9"/>
      <path id="building-cornice-drum" d="M 338 172 L 462 172 L 462 190 L 338 190 Z" fill="#E7DFF5" stroke="#1E1A4D" stroke-width="9"/>
      <!-- louvred drum, ribbed dome, finial -->
      <path id="building-drum" d="M 356 190 L 444 190 L 444 214 L 356 214 Z" fill="#F5F2F9" stroke="#1E1A4D" stroke-width="9"/>
      <path id="building-dome" d="M 358 174 C 358 128 374 104 400 98 C 426 104 442 128 442 174 Z" fill="#F5F2F9" stroke="#1E1A4D" stroke-width="12"/>
      <path id="building-dome-ribs" d="M 374 172 C 374 136 383 114 396 102 M 389 172 C 389 134 393 115 400 102 M 411 172 C 411 134 407 115 400 102 M 426 172 C 426 136 417 114 404 102" stroke="#AA82BC" stroke-width="7"/>
      <path id="building-finial" d="M 400 98 L 400 84" stroke="#1E1A4D" stroke-width="9"/>
      <circle cx="400" cy="78" r="9" fill="#AA82BC" stroke="#1E1A4D" stroke-width="6"/>
      <!-- parapet along the wings -->
      <path id="building-roofline" d="M 76 224 L 306 224 L 306 244 L 76 244 Z M 494 224 L 724 224 L 724 244 L 494 244 Z" fill="#E7DFF5" stroke="#1E1A4D" stroke-width="12"/>
    </g>

    <!-- ============ WINDOW BANDS ============ -->
    <g id="building-windows">
      <path id="building-windows-upper" d="M 168 260 h 28 v 24 h -28 Z M 200 260 h 28 v 24 h -28 Z M 232 260 h 28 v 24 h -28 Z M 264 260 h 28 v 24 h -28 Z M 508 260 h 28 v 24 h -28 Z M 540 260 h 28 v 24 h -28 Z M 572 260 h 28 v 24 h -28 Z M 604 260 h 28 v 24 h -28 Z " fill="#C6B4E6"/>
      <path id="building-windows-middle" d="M 168 302 h 28 v 24 h -28 Z M 200 302 h 28 v 24 h -28 Z M 232 302 h 28 v 24 h -28 Z M 264 302 h 28 v 24 h -28 Z M 508 302 h 28 v 24 h -28 Z M 540 302 h 28 v 24 h -28 Z M 572 302 h 28 v 24 h -28 Z M 604 302 h 28 v 24 h -28 Z " fill="#C6B4E6"/>
      <path id="building-windows-lower" d="M 168 344 h 28 v 24 h -28 Z M 200 344 h 28 v 24 h -28 Z M 232 344 h 28 v 24 h -28 Z M 264 344 h 28 v 24 h -28 Z M 508 344 h 28 v 24 h -28 Z M 540 344 h 28 v 24 h -28 Z M 572 344 h 28 v 24 h -28 Z M 604 344 h 28 v 24 h -28 Z " fill="#C6B4E6"/>
      <path id="building-louvres" d="M 124 260 L 156 260 L 156 326 L 124 326 Z M 644 260 L 676 260 L 676 326 L 644 326 Z" fill="#5A3D7A"/>
      <!-- ground floor arcade -->
      <path id="building-arcade" d="M 120 462 L 120 428 A 19 19 0 0 1 158 428 L 158 462 Z M 172 462 L 172 428 A 19 19 0 0 1 210 428 L 210 462 Z M 224 462 L 224 428 A 19 19 0 0 1 262 428 L 262 462 Z M 538 462 L 538 428 A 19 19 0 0 1 576 428 L 576 462 Z M 590 462 L 590 428 A 19 19 0 0 1 628 428 L 628 462 Z M 642 462 L 642 428 A 19 19 0 0 1 680 428 L 680 462 Z " fill="#AA82BC"/>
    </g>

    <!-- ============ CENTRAL GLAZING ============ -->
    <g id="building-glazing">
      <path id="building-glazed-band" d="M 348 242 L 452 242 L 452 284 L 348 284 Z" fill="#5A3D7A"/>
      <path id="building-band-flanks" d="M 326 242 L 338 242 L 338 284 L 326 284 Z M 462 242 L 474 242 L 474 284 L 462 284 Z" fill="#AA82BC"/>
      <path id="building-tall-windows" d="M 315 314 L 335 314 L 335 362 L 315 362 Z M 345 314 L 365 314 L 365 362 L 345 362 Z M 375 314 L 395 314 L 395 362 L 375 362 Z M 405 314 L 425 314 L 425 362 L 405 362 Z M 435 314 L 455 314 L 455 362 L 435 362 Z M 465 314 L 485 314 L 485 362 L 465 362 Z " fill="#AA82BC"/>
      <path id="building-square-windows" d="M 307 384 L 325 384 L 325 402 L 307 402 Z M 335 384 L 353 384 L 353 402 L 335 402 Z M 363 384 L 381 384 L 381 402 L 363 402 Z M 391 384 L 409 384 L 409 402 L 391 402 Z M 419 384 L 437 384 L 437 402 L 419 402 Z M 447 384 L 465 384 L 465 402 L 447 402 Z M 475 384 L 493 384 L 493 402 L 475 402 Z " fill="#AA82BC"/>
      <path id="building-drum-louvres" d="M 362 196 L 374 196 L 374 208 L 362 208 Z M 378 196 L 390 196 L 390 208 L 378 208 Z M 394 196 L 406 196 L 406 208 L 394 208 Z M 410 196 L 422 196 L 422 208 L 410 208 Z M 426 196 L 438 196 L 438 208 L 426 208 Z" fill="#AA82BC"/>
    </g>

    <!-- ============ ENTRANCE ============ -->
    <g id="building-entrance">
      <path id="building-entrance-recess" d="M 292 420 L 508 420 L 508 470 L 292 470 Z" fill="#E1D8F2" stroke="#1E1A4D" stroke-width="9"/>
      <path id="building-entrance-openings" d="M 306 428 L 352 428 L 352 470 L 306 470 Z M 372 428 L 428 428 L 428 470 L 372 470 Z M 448 428 L 494 428 L 494 470 L 448 470 Z" fill="#5A3D7A"/>
      <path id="building-entrance-columns" d="M 352 428 L 372 428 L 372 470 L 352 470 Z M 428 428 L 448 428 L 448 470 L 428 470 Z" fill="#F5F2F9" stroke="#1E1A4D" stroke-width="9"/>
    </g>
    <path id="building-entrance-canopy" d="M 282 404 L 518 404 L 518 422 L 282 422 Z" fill="#E7DFF5" stroke="#1E1A4D" stroke-width="9"/>
    <path id="building-steps" d="M 274 470 L 526 470 L 526 486 L 274 486 Z" fill="#E1D8F2" stroke="#1E1A4D" stroke-width="9"/>
  </g>
</svg>
