<svg class="it-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 310 156" width="310" height="156" fill="none" role="img" aria-labelledby="ttl dsc"><style>.it-art{--it-ink:#1E1A4D;--it-wall:#F1EDFA;--it-wall-hi:#F5F2F9;--it-ledge:#E7DFF5;--it-recess:#E1D8F2;--it-glass:#E7E1F6;--it-tyre:#F7F5FC;--it-hub:#DDD2F0;--it-skin:#D9CBF1;--it-window:#C6B4E6;--it-accent:#AA82BC;--it-deep:#5A3D7A;--it-muted:#B7A6CD;--it-shadow:#C7BBD9;--it-slab:#E9E1F6;--it-bush:#BFB2D4;--it-trail:#DCD2EA;--it-flag:#CDB5DE;--it-spark:#C0A9D8;--it-signal:#F0913F;--it-feature:#1E1A4D;--it-hair:#1E1A4D;--it-cloth:#1E1A4D}@media (prefers-color-scheme:dark){.it-art:not(.it-light){--it-ink:#E4DCFA;--it-wall:#1F2944;--it-wall-hi:#263152;--it-ledge:#2E3A5E;--it-recess:#232D4C;--it-glass:#2B3557;--it-tyre:#18203A;--it-hub:#3B4670;--it-skin:#B3A1E0;--it-window:#7A63B5;--it-accent:#A98ADF;--it-deep:#15122E;--it-muted:#4E5880;--it-shadow:#05070F;--it-slab:#19213A;--it-bush:#4E5880;--it-trail:#252F50;--it-flag:#8F70C6;--it-spark:#5A4C8C;--it-signal:#F0913F;--it-feature:#1E1A4D;--it-hair:#7058B4;--it-cloth:#15122E}}.dark-mode .it-art,.it-art.it-dark{--it-ink:#E4DCFA;--it-wall:#1F2944;--it-wall-hi:#263152;--it-ledge:#2E3A5E;--it-recess:#232D4C;--it-glass:#2B3557;--it-tyre:#18203A;--it-hub:#3B4670;--it-skin:#B3A1E0;--it-window:#7A63B5;--it-accent:#A98ADF;--it-deep:#15122E;--it-muted:#4E5880;--it-shadow:#05070F;--it-slab:#19213A;--it-bush:#4E5880;--it-trail:#252F50;--it-flag:#8F70C6;--it-spark:#5A4C8C;--it-signal:#F0913F;--it-feature:#1E1A4D;--it-hair:#7058B4;--it-cloth:#15122E}.it-art .f-ink{fill:var(--it-ink)}.it-art .s-ink{stroke:var(--it-ink)}.it-art .f-wall{fill:var(--it-wall)}.it-art .s-wall{stroke:var(--it-wall)}.it-art .f-wall-hi{fill:var(--it-wall-hi)}.it-art .s-wall-hi{stroke:var(--it-wall-hi)}.it-art .f-ledge{fill:var(--it-ledge)}.it-art .s-ledge{stroke:var(--it-ledge)}.it-art .f-recess{fill:var(--it-recess)}.it-art .s-recess{stroke:var(--it-recess)}.it-art .f-glass{fill:var(--it-glass)}.it-art .s-glass{stroke:var(--it-glass)}.it-art .f-tyre{fill:var(--it-tyre)}.it-art .s-tyre{stroke:var(--it-tyre)}.it-art .f-hub{fill:var(--it-hub)}.it-art .s-hub{stroke:var(--it-hub)}.it-art .f-skin{fill:var(--it-skin)}.it-art .s-skin{stroke:var(--it-skin)}.it-art .f-window{fill:var(--it-window)}.it-art .s-window{stroke:var(--it-window)}.it-art .f-accent{fill:var(--it-accent)}.it-art .s-accent{stroke:var(--it-accent)}.it-art .f-deep{fill:var(--it-deep)}.it-art .s-deep{stroke:var(--it-deep)}.it-art .f-muted{fill:var(--it-muted)}.it-art .s-muted{stroke:var(--it-muted)}.it-art .f-shadow{fill:var(--it-shadow)}.it-art .s-shadow{stroke:var(--it-shadow)}.it-art .f-slab{fill:var(--it-slab)}.it-art .s-slab{stroke:var(--it-slab)}.it-art .f-bush{fill:var(--it-bush)}.it-art .s-bush{stroke:var(--it-bush)}.it-art .f-trail{fill:var(--it-trail)}.it-art .s-trail{stroke:var(--it-trail)}.it-art .f-flag{fill:var(--it-flag)}.it-art .s-flag{stroke:var(--it-flag)}.it-art .f-spark{fill:var(--it-spark)}.it-art .s-spark{stroke:var(--it-spark)}.it-art .f-signal{fill:var(--it-signal)}.it-art .s-signal{stroke:var(--it-signal)}.it-art .f-feature{fill:var(--it-feature)}.it-art .s-feature{stroke:var(--it-feature)}.it-art .f-hair{fill:var(--it-hair)}.it-art .s-hair{stroke:var(--it-hair)}.it-art .f-cloth{fill:var(--it-cloth)}.it-art .s-cloth{stroke:var(--it-cloth)}.it-art .face .f-ink{fill:var(--it-feature)}.it-art .face .s-ink{stroke:var(--it-feature)}.it-art .hair .f-ink{fill:var(--it-hair)}.it-art .hair .s-ink{stroke:var(--it-hair)}.it-art .shorts.f-ink{fill:var(--it-cloth)}</style>
  <title id="ttl">Shared car</title>
  <desc id="dsc">Compact rounded car with the three students seated inside, visible through its windows, resting on a soft ground shadow.</desc>
  <!--
    Coordinates are the car's own local units, shared by both scene compositions.
    Anchor (axle point) = (153, 134): midway between the two wheel centres.
    Scenes place it with: translate(axleX, axleY) rotate(tilt) scale(s * flip, s) translate(-153, -134)
    Desktop s = 1.15, mobile s = 1.2. The shadow lives inside the group so it travels with the car.
  -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g id="vehicle">
      <ellipse class="f-shadow" id="vehicle-shadow" cx="153" cy="159" rx="146" ry="6"/>

      <g id="vehicle-wheels">
        <circle class="f-tyre s-ink" cx="62" cy="134" r="22" stroke-width="4"/>
        <circle class="f-tyre s-ink" cx="244" cy="134" r="22" stroke-width="4"/>
        <circle class="f-hub s-ink" cx="62" cy="134" r="8" stroke-width="3.2"/>
        <circle class="f-hub s-ink" cx="244" cy="134" r="8" stroke-width="3.2"/>
      </g>

      <path class="f-wall s-ink" id="vehicle-body"
        d="M 20 104 L 66 46 Q 74 40 88 40 L 186 40 Q 200 40 208 48 L 232 84
           Q 238 90 248 92 L 276 96 Q 292 100 296 110 C 302 120 300 129 294 132 Q 290 134 282 134
           H 266 A 22 22 0 0 0 222 134 H 84 A 22 22 0 0 0 40 134 H 24
           Q 14 134 14 124 V 114 Q 14 104 20 104 Z"
        stroke-width="4"/>

      <g id="vehicle-windows">
        <path class="f-glass" d="M 176 46 L 200 46 L 224 86 L 176 86 Z"/>
        <path class="f-glass" d="M 112 48 L 168 48 L 168 86 L 112 86 Z"/>
        <path class="f-glass" d="M 73 48 L 106 48 L 106 86 L 43 86 Z"/>
      </g>

      <clipPath id="vehicle-window-clip"><path d="M 176 46 L 200 46 L 224 86 L 176 86 Z M 112 48 L 168 48 L 168 86 L 112 86 Z M 73 48 L 106 48 L 106 86 L 43 86 Z"/></clipPath>
      <g id="passengers" clip-path="url(#vehicle-window-clip)">
        <!-- passenger-n matches stand-n: 1 backpack, 2 suitcase (bun), 3 tote (cap) -->
        <g id="passenger-1">
          <path class="f-window s-ink" d="M 52 86 Q 76 74 100 86 Z" stroke-width="3"/>
          <g transform="translate(84,67) scale(0.9) translate(0,56)"><g class="head"><circle class="f-skin s-ink" cx="0" cy="-56" r="13" stroke-width="3.4"/>
      <g class="face"><circle class="f-ink" cx="-4.6" cy="-56.2" r="2.1"/><circle class="f-ink" cx="4.6" cy="-56.2" r="2.1"/>
      <path class="s-ink" d="M -7.2 -61.6 Q -4.8 -63.4 -2.4 -62.2 M 2.4 -62.2 Q 4.8 -63.4 7.2 -61.6" stroke-width="1.9"/>
      <path class="s-ink" d="M -4.6 -50.6 Q 0 -46.2 4.6 -50.6" stroke-width="2.2"/></g><g class="hair"><path class="f-ink" d="M -13.4 -57 C -14.6 -70 -4.5 -74.5 2.5 -71.8 C 9.5 -73.6 15.2 -67 13.4 -58.5 C 11 -63.6 6.4 -66.6 1.2 -65.8 C -2.8 -65.2 -6.2 -67 -8.6 -64.6 C -10.8 -63.4 -12.6 -61 -13.4 -57 Z"/></g></g></g>
        </g>
        <g id="passenger-2">
          <path class="f-accent s-ink" d="M 118 86 Q 140 72 162 86 Z" stroke-width="3"/>
          <g transform="translate(140,66) scale(0.9) translate(0,56)"><g class="head"><circle class="f-skin s-ink" cx="0" cy="-56" r="13" stroke-width="3.4"/>
      <g class="face"><circle class="f-ink" cx="-4.6" cy="-56.2" r="2.1"/><circle class="f-ink" cx="4.6" cy="-56.2" r="2.1"/>
      <path class="s-ink" d="M -7.2 -61.6 Q -4.8 -63.4 -2.4 -62.2 M 2.4 -62.2 Q 4.8 -63.4 7.2 -61.6" stroke-width="1.9"/>
      <path class="f-deep s-ink" d="M -5 -51.2 Q 0 -44.2 5 -51.2 Z" stroke-width="2"/></g><g class="hair"><circle class="f-ink" cx="0" cy="-73" r="5.6"/><path class="f-ink" d="M -13.6 -54 C -14.2 -68.8 -6.2 -71.6 0 -71.6 C 6.2 -71.6 14.2 -68.8 13.6 -54 C 11.2 -60.8 6.2 -64.6 0 -64.6 C -6.2 -64.6 -11.2 -60.8 -13.6 -54 Z"/><path class="s-ink" d="M -13.2 -54 C -14.8 -49.5 -14.2 -46 -11.8 -43.6" stroke-width="3.4"/></g></g></g>
        </g>
        <g id="passenger-3">
          <path class="f-recess s-ink" d="M 182 86 Q 196 73 210 86 Z" stroke-width="3"/>
          <g transform="translate(196,66) scale(0.9) translate(0,56)"><g class="head"><circle class="f-skin s-ink" cx="0" cy="-56" r="13" stroke-width="3.4"/>
      <g class="face"><circle class="f-ink" cx="-4.6" cy="-56.2" r="2.1"/><circle class="f-ink" cx="4.6" cy="-56.2" r="2.1"/>
      <path class="s-ink" d="M -7.2 -61.6 Q -4.8 -63.4 -2.4 -62.2 M 2.4 -62.2 Q 4.8 -63.4 7.2 -61.6" stroke-width="1.9"/>
      <path class="s-ink" d="M -3.4 -50.2 Q 1.2 -46.6 5.4 -51.4" stroke-width="2.2"/></g><g class="hair"><path class="f-deep s-ink" d="M -13.2 -62 C -13.2 -71.4 -6.4 -74.4 0 -74.4 C 6.4 -74.4 13.2 -71.4 13.2 -62 Z" stroke-width="3"/><path class="f-deep s-ink" d="M 7 -62 L 21.5 -62 Q 23 -59.6 19.6 -59.4 L 8.4 -59.8" stroke-width="3"/><circle class="f-ink" cx="0" cy="-74.4" r="1.8"/></g></g></g>
        </g>
      </g>

      <g class="s-ink" id="vehicle-window-frames" fill="none" stroke-width="3.4">
        <path d="M 176 46 L 200 46 L 224 86 L 176 86 Z"/>
        <path d="M 112 48 L 168 48 L 168 86 L 112 86 Z"/>
        <path d="M 73 48 L 106 48 L 106 86 L 43 86 Z"/>
      </g>

      <g id="vehicle-details">
        <path class="s-muted" d="M 176 92 L 176 124" stroke-width="2.6"/>
        <rect class="f-signal s-ink" x="268" y="100" width="18" height="12" rx="5" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
