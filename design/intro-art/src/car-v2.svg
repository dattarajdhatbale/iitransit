<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 310 156" width="310" height="156" fill="none" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Shared car</title>
  <desc id="dsc">Compact rounded car with three passengers visible through its windows, resting on a soft ground shadow.</desc>
  <!--
    Coordinates are the car's own local units, shared by both scene compositions.
    Anchor (axle point) = (153, 134): midway between the two wheel centres.
    Scenes place it with: translate(axleX, axleY) rotate(tilt) scale(s * flip, s) translate(-153, -134)
    Desktop s = 1.15, mobile s = 1.2. The shadow lives inside the group so it travels with the car.
  -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g id="vehicle">
      <ellipse id="vehicle-shadow" cx="153" cy="159" rx="146" ry="6" fill="#C7BBD9"/>

      <g id="vehicle-wheels">
        <circle cx="62" cy="134" r="22" fill="#F7F5FC" stroke="#1E1A4D" stroke-width="4"/>
        <circle cx="244" cy="134" r="22" fill="#F7F5FC" stroke="#1E1A4D" stroke-width="4"/>
        <circle cx="62" cy="134" r="8" fill="#DDD2F0" stroke="#1E1A4D" stroke-width="3.2"/>
        <circle cx="244" cy="134" r="8" fill="#DDD2F0" stroke="#1E1A4D" stroke-width="3.2"/>
      </g>

      <path id="vehicle-body"
        d="M 20 104 L 66 46 Q 74 40 88 40 L 186 40 Q 200 40 208 48 L 232 84
           Q 238 90 248 92 L 276 96 Q 292 100 296 110 C 302 120 300 129 294 132 Q 290 134 282 134
           H 266 A 22 22 0 0 0 222 134 H 84 A 22 22 0 0 0 40 134 H 24
           Q 14 134 14 124 V 114 Q 14 104 20 104 Z"
        fill="#F1EDFA" stroke="#1E1A4D" stroke-width="4"/>

      <g id="vehicle-windows">
        <path d="M 176 46 L 200 46 L 224 86 L 176 86 Z" fill="#E7E1F6"/>
        <path d="M 112 48 L 168 48 L 168 86 L 112 86 Z" fill="#E7E1F6"/>
        <path d="M 73 48 L 106 48 L 106 86 L 43 86 Z" fill="#E7E1F6"/>
      </g>

      <g id="passengers">
        <!-- passenger-1 : rear quarter seat -->
        <g id="passenger-1">
          <path d="M 52 86 Q 76 74 100 86" fill="#C6B4E6" stroke="#1E1A4D" stroke-width="3"/>
          <path d="M 84 75 L 84 80" stroke="#1E1A4D" stroke-width="3"/>
          <g transform="rotate(6 84 66)">
            <circle cx="84" cy="66" r="10.5" fill="#D9CBF1" stroke="#1E1A4D" stroke-width="3.4"/>
            <circle cx="79.8" cy="64.5" r="1.9" fill="#1E1A4D"/>
            <circle cx="88.2" cy="64.5" r="1.9" fill="#1E1A4D"/>
            <path d="M 80 70.4 Q 84 74.6 88 70.4" stroke="#1E1A4D" stroke-width="2.2"/>
          </g>
        </g>
        <!-- passenger-2 : rear seat -->
        <g id="passenger-2">
          <path d="M 118 86 Q 140 72 162 86" fill="#C6B4E6" stroke="#1E1A4D" stroke-width="3"/>
          <path d="M 140 73 L 140 80" stroke="#1E1A4D" stroke-width="3"/>
          <g transform="rotate(-4 140 64)">
            <circle cx="140" cy="64" r="10.5" fill="#D9CBF1" stroke="#1E1A4D" stroke-width="3.4"/>
            <circle cx="135.8" cy="62.5" r="1.9" fill="#1E1A4D"/>
            <circle cx="144.2" cy="62.5" r="1.9" fill="#1E1A4D"/>
            <path d="M 135.3 68.4 Q 140 74 144.7 68.4" stroke="#1E1A4D" stroke-width="2.2"/>
          </g>
        </g>
        <!-- passenger-3 : front seat -->
        <g id="passenger-3">
          <path d="M 182 86 Q 196 73 210 86" fill="#C6B4E6" stroke="#1E1A4D" stroke-width="3"/>
          <path d="M 196 73 L 196 80" stroke="#1E1A4D" stroke-width="3"/>
          <g transform="rotate(5 196 64)">
            <circle cx="196" cy="64" r="10.5" fill="#D9CBF1" stroke="#1E1A4D" stroke-width="3.4"/>
            <circle cx="191.8" cy="62.5" r="1.8" fill="#1E1A4D"/>
            <circle cx="200.2" cy="62.5" r="1.8" fill="#1E1A4D"/>
            <path d="M 192 68.4 Q 196 72.6 200 68.4" stroke="#1E1A4D" stroke-width="2.2"/>
          </g>
        </g>
      </g>

      <g id="vehicle-window-frames" fill="none" stroke="#1E1A4D" stroke-width="3.4">
        <path d="M 176 46 L 200 46 L 224 86 L 176 86 Z"/>
        <path d="M 112 48 L 168 48 L 168 86 L 112 86 Z"/>
        <path d="M 73 48 L 106 48 L 106 86 L 43 86 Z"/>
      </g>

      <g id="vehicle-details">
        <path d="M 176 92 L 176 124" stroke="#B7A6CD" stroke-width="2.6"/>
        <rect x="268" y="100" width="18" height="12" rx="5" fill="#F0913F" stroke="#1E1A4D" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
